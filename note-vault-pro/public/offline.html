<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'"
    />
    <title>NoteVault Pro</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --card: #ffffff;
        --fg: #17162b;
        --muted: #64637a;
        --primary: #2b2a6f;
        --line: #e4e1d8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d0e1d;
          --card: #16182c;
          --fg: #f3f3fa;
          --muted: #a1a3ba;
          --primary: #6366f1;
          --line: #282a45;
        }
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 28px 24px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
      }
      p {
        margin: 0 0 12px;
        color: var(--muted);
        line-height: 1.6;
        font-size: 14px;
      }
      .btn {
        display: inline-block;
        margin-top: 8px;
        padding: 11px 22px;
        border-radius: 12px;
        text-decoration: none;
        background: var(--primary);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>NoteVault Pro</h1>
      <p>أنت غير متصل بالإنترنت حالياً وهذه الصفحة غير محفوظة على جهازك بعد. اتصل بالإنترنت ثم حاول مجدداً.</p>
      <p dir="ltr">You are currently offline and this page is not saved on your device yet. Reconnect and try again.</p>
      <a class="btn" href="./">إعادة المحاولة · Try again</a>
    </main>
  </body>
</html>
