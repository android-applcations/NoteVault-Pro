<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#2b2a6f" />
    <meta name="description" content="NoteVault Pro – كل محاضراتك، ملاحظاتك، ملفاتك، وأفكارك في مكان واحد." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>NoteVault Pro – الخزنة الذكية للملاحظات والمعرفة الجامعية</title>
    <script>
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem("nv-prefs") || "{}");
          var d = document.documentElement;
          var lang = p.lang === "en" ? "en" : "ar";
          d.lang = lang; d.dir = lang === "ar" ? "rtl" : "ltr";
          var dark = p.theme === "dark" || ((!p.theme || p.theme === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) d.classList.add("dark");
          if (p.reduceMotion) d.classList.add("reduce-motion");
          if (p.textSize) d.style.fontSize = ({ sm: "14px", md: "16px", lg: "18px", xl: "20px" })[p.textSize] || "16px";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
